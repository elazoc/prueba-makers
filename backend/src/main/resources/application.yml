spring:
  application:
    name: prestemos
  web:
    locale: es
    locale-resolver: fixed
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:prestemos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  h2:
    console:
      enabled: true
  mvc:
    async:
      # The live events stream is an async request: it closes after this and the front reconnects with its
      # current token. Keep it below the proxy's SSE timeout (35 min in nginx).
      request-timeout: 30m

security:
  jwt:
    issuer: prestemos
    # Short-lived: the front renews it with the refresh token.
    ttl: 15m
    # PEM keys for production (both or neither); without them a key pair is generated at startup.
    # public-key: file:/run/secrets/jwt-public.pem
    # private-key: file:/run/secrets/jwt-private.pem
  refresh:
    # Absolute life of a session from login; rotations do not extend it.
    ttl: 7d
    # A token rotated less than this ago is rejected without revoking its family (two tabs racing).
    reuse-grace: 10s
    cookie-name: prestemos_refresh

app:
  cors:
    allowed-origins: http://localhost:4200
  sse:
    # SSE comment that keeps an idle live events stream open through proxies.
    heartbeat: 15s

loans:
  policy:
    min-amount: 100.00
    max-amount: 50000000.00
    min-term-months: 1
    max-term-months: 120
    max-pending-per-user: 3
