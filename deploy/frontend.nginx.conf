# nginx del servicio frontend en producción (docker-compose.prod.yml).
#
# Provisional, de la sesión de despliegue: sirve el Angular compilado por scripts/deploy.sh hasta
# que el front tenga su propio Dockerfile y nginx/default.conf.template; entonces se reemplaza.
#
# Delante está el nginx del servidor (HTTPS). Aquí todo llega por http, así que se reenvían sus
# cabeceras X-Forwarded-* tal cual: el backend (forward-headers-strategy=native) sabe que el
# cliente usó HTTPS.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    # Eventos en vivo (SSE): sin buffer y con conexión larga (el backend corta a los 30 min).
    location /api/v1/loans/events {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 35m;
    }

    # API, documentación y salud: al backend, sin la CSP del front (rompería Swagger UI).
    location ~ ^/(api/|swagger-ui(\.html|/)|v3/api-docs|actuator/health) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Archivos con huella en el nombre (main-XXXXXXXX.js): no cambian nunca, caché larga.
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # La aplicación: rutas del Angular caen en index.html, que no se guarda en caché.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
